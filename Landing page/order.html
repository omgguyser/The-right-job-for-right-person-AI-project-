<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครตำแหน่งงาน — The Right Job For Right Person</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .order-wrap {
    max-width: 560px;
    margin: 0 auto;
  }
  .field {
    margin-bottom: var(--space-md);
  }
  .field label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-text-faint);
    margin-bottom: 0.6rem;
  }
  .field input,
  .field textarea {
    width: 100%;
    background: var(--color-carbon);
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    padding: 0.85rem 1rem;
    color: var(--color-text);
    font-family: var(--font-sans);
    font-size: 0.95rem;
    transition: border-color var(--transition);
  }
  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--color-accent);
  }
  .field input[readonly] {
    color: var(--color-text-soft);
    background: var(--color-carbon-2);
    cursor: default;
  }
  .field textarea {
    resize: vertical;
    min-height: 100px;
  }
  .order-summary {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-top: 1px solid var(--color-line);
    border-bottom: 1px solid var(--color-line);
    padding: var(--space-sm) 0;
    margin-bottom: var(--space-lg);
  }
  .order-summary__label {
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-text-faint);
  }
  .order-summary__value {
    font-family: var(--font-serif);
    font-size: 1.4rem;
  }
  button.btn--submit {
    width: 100%;
    justify-content: center;
    padding: 1rem;
    cursor: pointer;
  }
</style>
</head>
<body>

  <header class="navbar">
    <div class="container navbar__inner">
      <a href="index.html" class="navbar__logo">THE RIGHT JOB<br>FOR RIGHT PERSON</a>
      <nav class="navbar__links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">ตำแหน่งงานทั้งหมด</a>
      </nav>
    </div>
  </header>

  <section class="section section--tight">
    <div class="container order-wrap">
      <p class="eyebrow text-center" style="display:block;">แบบฟอร์มสมัครงาน</p>
      <h1 class="text-center" style="margin-bottom:var(--space-lg);">กรอกข้อมูลของคุณ</h1>

      <div class="order-summary">
        <span class="order-summary__label">ตำแหน่งที่เลือก</span>
        <span class="order-summary__value" id="job">—</span>
      </div>

      <form id="orderForm">

        <div class="field">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" required minlength="2" placeholder="ชื่อ-นามสกุล">
        </div>

        <div class="field">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" required placeholder="เบอร์โทรศัพท์ หรือ Line ID">
        </div>

        <div class="field">
          <label for="items">รายการงาน</label>
          <input type="text" id="items" name="items" readonly>
        </div>

        <div class="field">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="text" id="total" name="total" readonly>
        </div>

        <div class="field">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" placeholder="ข้อความเพิ่มเติม (ถ้ามี)"></textarea>
        </div>

        <button type="submit" class="btn btn--solid btn--submit">ยืนยันสมัคร</button>

      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer__inner">
      <span>&copy; 2026 The Right Job For Right Person</span>
      <span>งานที่ใช่ สำหรับคนที่ชอบ</span>
    </div>
  </footer>

  <script src="script.js?v=2"></script>
</body>
</html>
